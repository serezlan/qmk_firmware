# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  flash:
    silent: true
    cmds:
      - rm -rf nohup.out
      - nohup qmk flash -kb lily58 -km serezlan -bl avrdude
      - espeak -s 400 "success"


  build:
    silent: true
    cmds:
      - rm -rf nohup.out
      - nohup qmk compile -kb lily58 -km serezlan
      - espeak -s 400 "success"

  flash-default:
    silent: true
    cmds:
      - rm -rf nohup.out
      - nohup qmk flash -kb lily58 -km default -bl avrdude
      - espeak -s 400 "success"
